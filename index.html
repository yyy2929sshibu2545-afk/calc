<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="計算機">
  <title>計算機</title>
  <style>
    :root {
      --bg-black: #000000;
      --btn-gray-dark: #2c2c2e;
      --btn-gray-light: #505050;
      --btn-orange: #ff9f0a;
      --text-white: #ffffff;
      --text-gray: #8e8e93;
      --safe-top: env(safe-area-inset-top, 40px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--text-white);
      overflow: hidden;
    }

    /* ================= 電卓画面 ================= */
    #calculator-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: var(--safe-top) 16px var(--safe-bottom) 16px;
      justify-content: flex-end;
      position: relative;
    }

    .top-icons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
      margin-bottom: auto;
      z-index: 10;
    }

    .icon-btn {
      background: #1c1c1e;
      border: none;
      color: #98989d;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }

    #mode-menu {
      display: none;
      position: absolute;
      top: calc(var(--safe-top) + 50px);
      right: 16px;
      background: #252528;
      border-radius: 14px;
      width: 180px;
      padding: 6px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 50;
      border: 1px solid #38383a;
    }

    .menu-item {
      padding: 10px 16px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }
    .menu-item.active { color: #0a84ff; }
    .menu-divider { height: 1px; background: #38383a; margin: 4px 0; }

    .display-container {
      width: 100%;
      text-align: right;
      padding: 0 12px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 120px;
    }

    #calc-expression {
      font-size: 28px;
      color: var(--text-gray);
      min-height: 34px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      margin-bottom: 2px;
    }

    #calc-display {
      font-size: 78px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -1.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .btn {
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: none;
      font-size: 30px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: filter 0.12s ease, transform 0.05s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { filter: brightness(1.35); transform: scale(0.96); }
    .btn-dark { background-color: var(--btn-gray-dark); color: var(--text-white); }
    .btn-light { background-color: var(--btn-gray-light); color: var(--text-white); }
    .btn-orange { background-color: var(--btn-orange); color: var(--text-white); }

    /* ================= 履歴シート ================= */
    #history-sheet {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
    }

    .sheet-content {
      background: #1c1c1e;
      border-radius: 20px 20px 0 0;
      height: 70vh;
      display: flex;
      flex-direction: column;
      padding: 16px 20px var(--safe-bottom);
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .sheet-title { font-size: 17px; font-weight: 600; color: #ff9f0a; }
    .sheet-close {
      background: #2c2c2e;
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
    }
    .history-list { flex: 1; overflow-y: auto; }
    .history-item { padding: 12px 0; border-bottom: 1px solid #2c2c2e; text-align: right; }
    .hist-expr { font-size: 14px; color: var(--text-gray); }
    .hist-val { font-size: 24px; font-weight: 500; }

    /* ================= 金庫画面 ================= */
    #vault-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      background: #121212;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    .vault-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #1c1c1e;
      border-bottom: 1px solid #2c2c2e;
    }

    .vault-title { font-size: 18px; font-weight: 600; }
    .header-actions { display: flex; gap: 8px; align-items: center; }

    .btn-header {
      background: #2c2c2e;
      border: none;
      color: #0a84ff;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 14px;
    }
    .btn-lock { background: #ff453a; color: white; }

    /* フォルダ選択バー */
    .folder-bar {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: #18181a;
      overflow-x: auto;
      border-bottom: 1px solid #242426;
      white-space: nowrap;
    }

    .folder-pill {
      background: #2c2c2e;
      color: #8e8e93;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
    }

    .folder-pill.active {
      background: #0a84ff;
      color: #ffffff;
      font-weight: 600;
    }

    .folder-pill-add {
      background: #242426;
      color: #30d158;
      border: 1px dashed #30d158;
    }

    .backup-bar {
      display: flex;
      gap: 10px;
      padding: 8px 14px;
      background: #151516;
      border-bottom: 1px solid #222;
    }

    .btn-backup {
      flex: 1;
      background: #242426;
      color: #30d158;
      border: none;
      padding: 6px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
    }

    .gallery-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      align-content: start;
    }

    .video-card {
      background: #1c1c1e;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .thumb-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      cursor: pointer;
    }

    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .play-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .card-footer {
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #242426;
    }
    .video-folder-tag { font-size: 10px; color: #0a84ff; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-btns { display: flex; gap: 8px; }
    .card-btn { background: none; border: none; font-size: 14px; cursor: pointer; }

    /* モーダル */
    #player-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 200;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #modal-video { width: 100%; max-height: 80vh; outline: none; }
    .modal-close {
      position: absolute;
      top: calc(var(--safe-top) + 12px);
      right: 20px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    #setup-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 300;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .setup-box {
      background: #1c1c1e;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .setup-box input {
      width: 100%;
      font-size: 22px;
      text-align: center;
      padding: 10px;
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      color: #fff;
      border-radius: 10px;
      margin: 16px 0;
      outline: none;
    }
    .setup-box button {
      width: 100%;
      padding: 12px;
      background: #0a84ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- 電卓画面 -->
  <div id="calculator-screen" onclick="closeModeMenu(event)">
    <div class="top-icons">
      <button class="icon-btn" onclick="openHistory(event)">🕒</button>
      <button class="icon-btn" onclick="toggleModeMenu(event)">🧮</button>
    </div>

    <!-- 右上メニュー -->
    <div id="mode-menu">
      <div class="menu-item active">✓ 基本</div>
      <div class="menu-item">ƒ(x) 科学計算</div>
      <div class="menu-item">📝 計算メモ</div>
      <div class="menu-divider"></div>
      <div class="menu-item">⇄ 換算</div>
    </div>

    <div class="display-container">
      <div id="calc-expression"></div>
      <div id="calc-display">0</div>
    </div>

    <div class="keypad">
      <button class="btn btn-light" onclick="onKey('back')">⌫</button>
      <button class="btn btn-light" id="btn-ac" onclick="onKey('clear')">AC</button>
      <button class="btn btn-light" onclick="onKey('%')">%</button>
      <button class="btn btn-orange" onclick="onKey('/')">÷</button>

      <button class="btn btn-dark" onclick="onKey('7')">7</button>
      <button class="btn btn-dark" onclick="onKey('8')">8</button>
      <button class="btn btn-dark" onclick="onKey('9')">9</button>
      <button class="btn btn-orange" onclick="onKey('*')">×</button>

      <button class="btn btn-dark" onclick="onKey('4')">4</button>
      <button class="btn btn-dark" onclick="onKey('5')">5</button>
      <button class="btn btn-dark" onclick="onKey('6')">6</button>
      <button class="btn btn-orange" onclick="onKey('-')">−</button>

      <button class="btn btn-dark" onclick="onKey('1')">1</button>
      <button class="btn btn-dark" onclick="onKey('2')">2</button>
      <button class="btn btn-dark" onclick="onKey('3')">3</button>
      <button class="btn btn-orange" onclick="onKey('+')">+</button>

      <button class="btn btn-dark" onclick="onKey('+/-')">±</button>
      <button class="btn btn-dark" onclick="onKey('0')">0</button>
      <button class="btn btn-dark" onclick="onKey('.')">.</button>
      <button class="btn btn-orange" onclick="onKey('=')">=</button>
    </div>
  </div>

  <!-- 履歴シート -->
  <div id="history-sheet" onclick="closeHistory(event)">
    <div class="sheet-content" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <span class="sheet-title" onclick="clearHistory()">すべて消去</span>
        <button class="sheet-close" onclick="closeHistory()">✕</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <!-- 金庫画面 -->
  <div id="vault-screen">
    <div class="vault-header">
      <span class="vault-title">秘密の金庫</span>
      <div class="header-actions">
        <button class="btn-header" onclick="triggerUpload()">＋ 追加</button>
        <button class="btn-header btn-lock" onclick="lockVault()">🔒 ロック</button>
      </div>
    </div>

    <!-- フォルダ選択バー -->
    <div class="folder-bar" id="folder-bar">
      <!-- JSで動的生成 -->
    </div>

    <!-- バックアップバー -->
    <div class="backup-bar">
      <button class="btn-backup" onclick="exportFullBackup()">💾 全体バックアップ</button>
      <button class="btn-backup" onclick="triggerRestore()">📂 バックアップ復元</button>
      <input type="file" id="restore-input" accept=".json" style="display:none" onchange="handleRestoreFile(event)">
    </div>

    <input type="file" id="video-input" accept="video/*" multiple style="display:none" onchange="handleFileSelect(event)">
    <div class="gallery-container" id="gallery"></div>
  </div>

  <!-- 動画再生モーダル -->
  <div id="player-modal">
    <button class="modal-close" onclick="closePlayer()">✕</button>
    <video id="modal-video" controls playsinline></video>
  </div>

  <!-- 初回パスコード設定 -->
  <div id="setup-modal">
    <div class="setup-box">
      <h2>パスコード設定</h2>
      <p style="font-size:13px; color:#8e8e93; margin-top:6px;">
        解錠用コードを設定してください<br>（例: <code>1234%</code> や <code>77%8%</code> など % 付きも可）
      </p>
      <input type="text" id="initial-pass" placeholder="例: 1234%">
      <button onclick="saveInitialPasscode()">設定を保存</button>
    </div>
  </div>

  <script>
    // ================= IndexedDB =================
    let db;
    const DB_NAME = 'VaultDB';
    const STORE_NAME = 'videos';

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains(STORE_NAME)) {
            d.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e);
      });
    }

    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }

    // ================= 電卓 ＆ 解錠ロジック =================
    let currentInput = "0";
    let pendingOp = null;
    let prevVal = null;
    let resetOnNext = false;
    let historyData = JSON.parse(localStorage.getItem('calc_history') || '[]');
    let keySequence = ""; // パスワード照合用バッファ

    // フォルダ設定
    let currentFolder = "すべて";
    let folderList = JSON.parse(localStorage.getItem('vault_folders') || '["すべて", "メイン"]');

    function vibrate() {
      if (navigator.vibrate) navigator.vibrate(10);
    }

    function updateDisplay() {
      const disp = document.getElementById('calc-display');
      const expr = document.getElementById('calc-expression');
      const acBtn = document.getElementById('btn-ac');

      disp.innerText = currentInput;
      acBtn.innerText = (currentInput === "0" && pendingOp === null) ? "AC" : "C";

      if (pendingOp !== null && prevVal !== null) {
        const opSymbol = pendingOp === '*' ? '×' : (pendingOp === '/' ? '÷' : (pendingOp === '-' ? '−' : '+'));
        expr.innerText = `${prevVal}${opSymbol}${resetOnNext ? '' : currentInput}`;
      } else {
        expr.innerText = "";
      }
    }

    function checkPasscode(pressedKey) {
      keySequence += pressedKey;
      if (keySequence.length > 30) keySequence = keySequence.slice(-30);

      const savedPass = localStorage.getItem('vault_passcode');
      if (savedPass && keySequence.endsWith(savedPass)) {
        keySequence = "";
        openVault();
        currentInput = "0";
        pendingOp = null;
        prevVal = null;
        updateDisplay();
        return true;
      }
      return false;
    }

    function onKey(key) {
      vibrate();

      // パスコードチェック（%等も含めて照合）
      if (checkPasscode(key)) {
        return;
      }

      if (!isNaN(key) || key === '.') {
        if (resetOnNext) {
          currentInput = key === '.' ? '0.' : key;
          resetOnNext = false;
        } else {
          if (key === '.' && currentInput.includes('.')) return;
          currentInput = (currentInput === '0' && key !== '.') ? key : currentInput + key;
        }
        updateDisplay();
        return;
      }

      if (key === 'clear') {
        currentInput = "0";
        pendingOp = null;
        prevVal = null;
        keySequence = "";
        updateDisplay();
        return;
      }

      if (key === 'back') {
        currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : "0";
        updateDisplay();
        return;
      }

      if (key === '+/-') {
        currentInput = String(parseFloat(currentInput) * -1);
        updateDisplay();
        return;
      }

      if (key === '%') {
        currentInput = String(parseFloat(currentInput) / 100);
        updateDisplay();
        return;
      }

      if (key === '=') {
        if (pendingOp && prevVal !== null) {
          const cur = parseFloat(currentInput);
          let res = cur;
          const opSymbol = pendingOp === '*' ? '×' : (pendingOp === '/' ? '÷' : (pendingOp === '-' ? '−' : '+'));
          const formula = `${prevVal}${opSymbol}${cur}`;

          if (pendingOp === '+') res = prevVal + cur;
          if (pendingOp === '-') res = prevVal - cur;
          if (pendingOp === '*') res = prevVal * cur;
          if (pendingOp === '/') res = cur !== 0 ? prevVal / cur : "エラー";

          historyData.unshift({ expr: formula, val: res });
          localStorage.setItem('calc_history', JSON.stringify(historyData));

          document.getElementById('calc-expression').innerText = formula;
          currentInput = String(res);
          document.getElementById('calc-display').innerText = currentInput;

          pendingOp = null;
          prevVal = null;
          resetOnNext = true;
        }
        return;
      }

      if (['+', '-', '*', '/'].includes(key)) {
        prevVal = parseFloat(currentInput);
        pendingOp = key;
        resetOnNext = true;
        updateDisplay();
      }
    }

    // ================= モード切替 & 履歴 =================
    function toggleModeMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('mode-menu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }
    function closeModeMenu() { document.getElementById('mode-menu').style.display = 'none'; }

    function openHistory(e) {
      e.stopPropagation();
      renderHistory();
      document.getElementById('history-sheet').style.display = 'flex';
    }
    function closeHistory() { document.getElementById('history-sheet').style.display = 'none'; }

    function renderHistory() {
      const list = document.getElementById('history-list');
      if (historyData.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:#8e8e93; margin-top:40px;">履歴なし</div>';
        return;
      }
      list.innerHTML = historyData.map(h => `
        <div class="history-item">
          <div class="hist-expr">${h.expr}</div>
          <div class="hist-val">${h.val}</div>
        </div>
      `).join('');
    }
    function clearHistory() {
      historyData = [];
      localStorage.removeItem('calc_history');
      renderHistory();
    }

    // ================= パスコード登録 =================
    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      const savedPass = localStorage.getItem('vault_passcode');
      if (!savedPass) {
        document.getElementById('setup-modal').style.display = 'flex';
      }
    });

    function saveInitialPasscode() {
      const pass = document.getElementById('initial-pass').value.trim();
      if (pass.length >= 2) {
        localStorage.setItem('vault_passcode', pass);
        document.getElementById('setup-modal').style.display = 'none';
        alert(`パスコードを設定しました。\n電卓で「${pass}」と押すと解錠されます。`);
      } else {
        alert('2文字以上のパスコードを入力してください。');
      }
    }

    // ================= 金庫 ＆ フォルダ機能 =================
    function openVault() {
      document.getElementById('calculator-screen').style.display = 'none';
      document.getElementById('vault-screen').style.display = 'flex';
      renderFolderBar();
      loadGallery();
    }
    function lockVault() {
      closePlayer();
      document.getElementById('vault-screen').style.display = 'none';
      document.getElementById('calculator-screen').style.display = 'flex';
    }

    function renderFolderBar() {
      const bar = document.getElementById('folder-bar');
      bar.innerHTML = folderList.map(f => `
        <button class="folder-pill ${f === currentFolder ? 'active' : ''}" onclick="selectFolder('${f}')">📁 ${f}</button>
      `).join('') + `
        <button class="folder-pill folder-pill-add" onclick="addNewFolder()">＋ 新規フォルダ</button>
      `;
    }

    function selectFolder(name) {
      currentFolder = name;
      renderFolderBar();
      loadGallery();
    }

    function addNewFolder() {
      const name = prompt('新しいフォルダ名を入力してください:');
      if (name && !folderList.includes(name)) {
        folderList.push(name);
        localStorage.setItem('vault_folders', JSON.stringify(folderList));
        currentFolder = name;
        renderFolderBar();
        loadGallery();
      }
    }

    function triggerUpload() { document.getElementById('video-input').click(); }

    function generateThumbnail(file) {
      return new Promise((resolve) => {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.src = URL.createObjectURL(file);
        video.muted = true;
        video.playsInline = true;
        video.currentTime = 0.5;
        video.onloadeddata = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 320;
          canvas.height = 180;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(video.src);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        video.onerror = () => resolve('');
      });
    }

    async function handleFileSelect(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;
      const targetFolder = currentFolder === "すべて" ? "メイン" : currentFolder;

      for (let file of files) {
        const thumb = await generateThumbnail(file);
        const item = {
          blob: file,
          name: file.name,
          type: file.type,
          thumb: thumb,
          folder: targetFolder,
          date: new Date().toLocaleDateString('ja-JP')
        };
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).add(item);
      }
      event.target.value = '';
      setTimeout(loadGallery, 300);
    }

    function loadGallery() {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.openCursor(null, 'prev');

      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const data = cursor.value;
          const id = cursor.key;

          // フォルダフィルタ
          if (currentFolder === "すべて" || data.folder === currentFolder) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
              <div class="thumb-wrap" onclick="playVideo(${id})">
                <img src="${data.thumb || ''}" alt="thumb">
                <div class="play-badge">▶</div>
              </div>
              <div class="card-footer">
                <span class="video-folder-tag" onclick="moveVideoFolder(${id}, '${data.folder || 'メイン'}')">📁 ${data.folder || 'メイン'}</span>
                <div class="card-btns">
                  <button class="card-btn" onclick="exportVideo(${id})">📥</button>
                  <button class="card-btn" onclick="deleteVideo(${id})">🗑️</button>
                </div>
              </div>
            `;
            gallery.appendChild(card);
          }
          cursor.continue();
        }
      };
    }

    function moveVideoFolder(id, current) {
      const targetFolders = folderList.filter(f => f !== "すべて");
      const chosen = prompt(`移動先のフォルダ名を入力してください:\n[利用可能: ${targetFolders.join(', ')}]`, current);
      if (chosen && targetFolders.includes(chosen)) {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.get(id).onsuccess = (e) => {
          const item = e.target.result;
          item.folder = chosen;
          store.put(item);
          tx.oncomplete = () => loadGallery();
        };
      }
    }

    function playVideo(id) {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(id);
      req.onsuccess = (e) => {
        const record = e.target.result;
        if (record) {
          const videoEl = document.getElementById('modal-video');
          videoEl.src = URL.createObjectURL(record.blob);
          document.getElementById('player-modal').style.display = 'flex';
          videoEl.play();
        }
      };
    }

    function closePlayer() {
      const videoEl = document.getElementById('modal-video');
      videoEl.pause();
      if (videoEl.src) URL.revokeObjectURL(videoEl.src);
      videoEl.src = '';
      document.getElementById('player-modal').style.display = 'none';
    }

    async function exportVideo(id) {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(id);
      req.onsuccess = async (e) => {
        const record = e.target.result;
        if (!record) return;
        const file = new File([record.blob], record.name || 'video.mp4', { type: record.type || 'video/mp4' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: '動画の保存' });
          } catch (err) {}
        } else {
          const url = URL.createObjectURL(record.blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = record.name || 'video.mp4';
          a.click();
          URL.revokeObjectURL(url);
        }
      };
    }

    function deleteVideo(id) {
      if (confirm('この動画を削除しますか？')) {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => loadGallery();
      }
    }

    // ================= バックアップ & 復元 =================
    async function exportFullBackup() {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();

      req.onsuccess = async (e) => {
        const items = e.target.result;
        if (!items || items.length === 0) {
          alert('保存されている動画がありません。');
          return;
        }

        const backupList = [];
        for (let item of items) {
          const base64 = await blobToBase64(item.blob);
          backupList.push({
            name: item.name,
            type: item.type,
            thumb: item.thumb,
            folder: item.folder || 'メイン',
            date: item.date,
            data: base64
          });
        }

        const backupData = {
          folders: folderList,
          videos: backupList
        };

        const blob = new Blob([JSON.stringify(backupData)], { type: 'application/json' });
        const file = new File([blob], `calc_vault_backup_${new Date().toISOString().slice(0,10)}.json`, { type: 'application/json' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'バックアップの保存' });
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = file.name;
          a.click();
          URL.revokeObjectURL(url);
        }
      };
    }

    function blobToBase64(blob) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    }

    function triggerRestore() { document.getElementById('restore-input').click(); }

    function handleRestoreFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const backupList = parsed.videos || parsed; // 旧形式にも対応

          if (parsed.folders) {
            folderList = Array.from(new Set([...folderList, ...parsed.folders]));
            localStorage.setItem('vault_folders', JSON.stringify(folderList));
          }

          for (let item of backupList) {
            const res = await fetch(item.data);
            const blob = await res.blob();
            const record = {
              blob: blob,
              name: item.name,
              type: item.type,
              thumb: item.thumb,
              folder: item.folder || 'メイン',
              date: item.date
            };
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).add(record);
          }
          alert('復元が完了しました！');
          renderFolderBar();
          loadGallery();
        } catch (err) {
          alert('バックアップファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }
  </script>
</body>
