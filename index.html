<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="計算機">
  <title>計算機</title>
  <style>
    :root {
      --bg-black: #000000;
      --btn-gray-dark: #333333;
      --btn-gray-light: #a5a5a5;
      --btn-orange: #ff9f0a;
      --text-white: #ffffff;
      --text-black: #000000;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--text-white);
      overflow: hidden;
    }

    /* ================= 電卓画面 ================= */
    #calculator-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: var(--safe-top) 16px var(--safe-bottom) 16px;
      justify-content: flex-end;
    }

    .top-icons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px;
      margin-bottom: auto;
    }

    .icon-btn {
      background: #1c1c1e;
      border: none;
      color: #8e8e93;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .display-container {
      width: 100%;
      text-align: right;
      padding: 0 12px;
      margin-bottom: 12px;
    }

    #calc-display {
      font-size: 82px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .btn {
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: none;
      font-size: 32px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.05s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      filter: brightness(1.3);
      transform: scale(0.96);
    }

    .btn-dark { background-color: var(--btn-gray-dark); color: var(--text-white); }
    .btn-light { background-color: var(--btn-gray-light); color: var(--text-black); }
    .btn-orange { background-color: var(--btn-orange); color: var(--text-white); }
    .btn-orange.active { background-color: var(--text-white); color: var(--btn-orange); }

    /* ================= 金庫（動画ギャラリー）画面 ================= */
    #vault-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      background: #121212;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    .vault-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #1c1c1e;
      border-bottom: 1px solid #2c2c2e;
    }

    .vault-title {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
    }

    .header-actions {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .btn-header {
      background: #2c2c2e;
      border: none;
      color: #0a84ff;
      font-size: 15px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 16px;
    }

    .btn-lock {
      background: #ff453a;
      color: white;
    }

    .gallery-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      align-content: start;
    }

    .video-card {
      background: #1c1c1e;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .thumb-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      cursor: pointer;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: white;
    }

    .card-footer {
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #242426;
    }

    .video-date {
      font-size: 11px;
      color: #8e8e93;
    }

    .card-btns {
      display: flex;
      gap: 8px;
    }

    .card-btn {
      background: none;
      border: none;
      font-size: 15px;
      cursor: pointer;
    }

    /* ================= 再生モーダル ================= */
    #player-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #modal-video {
      width: 100%;
      max-height: 80vh;
      outline: none;
    }

    .modal-close {
      position: absolute;
      top: calc(var(--safe-top) + 12px);
      right: 20px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    /* ================= パスコード登録モーダル ================= */
    #setup-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .setup-box {
      background: #1c1c1e;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    .setup-box h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .setup-box p {
      font-size: 13px;
      color: #8e8e93;
      margin-bottom: 18px;
    }

    .setup-box input {
      width: 100%;
      font-size: 24px;
      letter-spacing: 8px;
      text-align: center;
      padding: 10px;
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      color: #fff;
      border-radius: 10px;
      margin-bottom: 18px;
      outline: none;
    }

    .setup-box button {
      width: 100%;
      padding: 12px;
      background: #0a84ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- 電卓画面 -->
  <div id="calculator-screen">
    <div class="top-icons">
      <button class="icon-btn" onclick="vibrate()">🕒</button>
      <button class="icon-btn" onclick="vibrate()">🧮</button>
    </div>
    <div class="display-container">
      <div id="calc-display">0</div>
    </div>
    <div class="keypad">
      <button class="btn btn-light" onclick="onKey('back')">⌫</button>
      <button class="btn btn-light" onclick="onKey('clear')">AC</button>
      <button class="btn btn-light" onclick="onKey('%')">%</button>
      <button class="btn btn-orange" onclick="onKey('/')">÷</button>

      <button class="btn btn-dark" onclick="onKey('7')">7</button>
      <button class="btn btn-dark" onclick="onKey('8')">8</button>
      <button class="btn btn-dark" onclick="onKey('9')">9</button>
      <button class="btn btn-orange" onclick="onKey('*')">×</button>

      <button class="btn btn-dark" onclick="onKey('4')">4</button>
      <button class="btn btn-dark" onclick="onKey('5')">5</button>
      <button class="btn btn-dark" onclick="onKey('6')">6</button>
      <button class="btn btn-orange" onclick="onKey('-')">−</button>

      <button class="btn btn-dark" onclick="onKey('1')">1</button>
      <button class="btn btn-dark" onclick="onKey('2')">2</button>
      <button class="btn btn-dark" onclick="onKey('3')">3</button>
      <button class="btn btn-orange" onclick="onKey('+')">+</button>

      <button class="btn btn-dark" onclick="onKey('+/-')">±</button>
      <button class="btn btn-dark" onclick="onKey('0')">0</button>
      <button class="btn btn-dark" onclick="onKey('.')">.</button>
      <button class="btn btn-orange" onclick="onKey('=')">=</button>
    </div>
  </div>

  <!-- 金庫画面 -->
  <div id="vault-screen">
    <div class="vault-header">
      <span class="vault-title">秘密の金庫</span>
      <div class="header-actions">
        <button class="btn-header" onclick="triggerUpload()">＋ 追加</button>
        <button class="btn-header btn-lock" onclick="lockVault()">🔒 ロック</button>
      </div>
    </div>
    <input type="file" id="video-input" accept="video/*" multiple style="display:none" onchange="handleFileSelect(event)">
    <div class="gallery-container" id="gallery"></div>
  </div>

  <!-- フルスクリーン動画再生モーダル -->
  <div id="player-modal">
    <button class="modal-close" onclick="closePlayer()">✕</button>
    <video id="modal-video" controls playsinline></video>
  </div>

  <!-- 初回パスコード設定モーダル -->
  <div id="setup-modal">
    <div class="setup-box">
      <h2>パスコード設定</h2>
      <p>金庫を開くための4桁の暗証番号を入力してください</p>
      <input type="password" id="initial-pass" maxlength="4" pattern="[0-9]*" inputmode="numeric" placeholder="••••">
      <button onclick="saveInitialPasscode()">設定を保存</button>
    </div>
  </div>

  <script>
    // ================= IndexedDB & ストレージ設定 =================
    let db;
    const DB_NAME = 'VaultDB';
    const STORE_NAME = 'videos';

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = (e) => reject(e);
      });
    }

    // ブラウザの自動クリーンアップを防ぐ（容量永続化）
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then(granted => {
        if (granted) console.log("Storage persistence granted.");
      });
    }

    // ================= 電卓ロジック =================
    let currentInput = "0";
    let pendingOp = null;
    let prevVal = null;
    let resetOnNext = false;

    function vibrate() {
      if (navigator.vibrate) navigator.vibrate(10);
    }

    function updateDisplay(val) {
      const display = document.getElementById('calc-display');
      let str = String(val);
      if (str.length > 9) str = parseFloat(val).toExponential(3);
      display.innerText = str;
    }

    function onKey(key) {
      vibrate();
      const savedPass = localStorage.getItem('vault_passcode');

      if (!isNaN(key) || key === '.') {
        if (resetOnNext) {
          currentInput = key === '.' ? '0.' : key;
          resetOnNext = false;
        } else {
          if (key === '.' && currentInput.includes('.')) return;
          currentInput = currentInput === '0' && key !== '.' ? key : currentInput + key;
        }
        updateDisplay(currentInput);
        return;
      }

      if (key === 'clear') {
        currentInput = "0";
        pendingOp = null;
        prevVal = null;
        updateDisplay("0");
        return;
      }

      if (key === 'back') {
        currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : "0";
        updateDisplay(currentInput);
        return;
      }

      if (key === '+/-') {
        currentInput = String(parseFloat(currentInput) * -1);
        updateDisplay(currentInput);
        return;
      }

      if (key === '%') {
        currentInput = String(parseFloat(currentInput) / 100);
        updateDisplay(currentInput);
        return;
      }

      if (key === '=') {
        // パスコード解錠チェック
        if (savedPass && currentInput === savedPass) {
          openVault();
          currentInput = "0";
          updateDisplay("0");
          return;
        }

        if (pendingOp && prevVal !== null) {
          const cur = parseFloat(currentInput);
          let res = cur;
          if (pendingOp === '+') res = prevVal + cur;
          if (pendingOp === '-') res = prevVal - cur;
          if (pendingOp === '*') res = prevVal * cur;
          if (pendingOp === '/') res = cur !== 0 ? prevVal / cur : "エラー";
          currentInput = String(res);
          updateDisplay(res);
          pendingOp = null;
          prevVal = null;
          resetOnNext = true;
        }
        return;
      }

      // 演算子
      if (['+', '-', '*', '/'].includes(key)) {
        prevVal = parseFloat(currentInput);
        pendingOp = key;
        resetOnNext = true;
      }
    }

    // ================= パスコード初期登録 =================
    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      const savedPass = localStorage.getItem('vault_passcode');
      if (!savedPass) {
        document.getElementById('setup-modal').style.display = 'flex';
      }
    });

    function saveInitialPasscode() {
      const pass = document.getElementById('initial-pass').value.trim();
      if (pass.length === 4 && !isNaN(pass)) {
        localStorage.setItem('vault_passcode', pass);
        document.getElementById('setup-modal').style.display = 'none';
        alert('パスコードを保存しました。電卓で「' + pass + '」と入力して「＝」を押すと金庫が開きます。');
      } else {
        alert('4桁の数字を入力してください');
      }
    }

    // ================= 金庫ロジック =================
    function openVault() {
      document.getElementById('calculator-screen').style.display = 'none';
      document.getElementById('vault-screen').style.display = 'flex';
      loadGallery();
    }

    function lockVault() {
      closePlayer();
      document.getElementById('vault-screen').style.display = 'none';
      document.getElementById('calculator-screen').style.display = 'flex';
    }

    function triggerUpload() {
      document.getElementById('video-input').click();
    }

    // サムネイル生成処理
    function generateThumbnail(file) {
      return new Promise((resolve) => {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.src = URL.createObjectURL(file);
        video.muted = true;
        video.playsInline = true;
        video.currentTime = 0.5;

        video.onloadeddata = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 320;
          canvas.height = 180;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(video.src);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        video.onerror = () => resolve('');
      });
    }

    async function handleFileSelect(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      for (let file of files) {
        const thumb = await generateThumbnail(file);
        const item = {
          blob: file,
          name: file.name,
          type: file.type,
          thumb: thumb,
          date: new Date().toLocaleDateString('ja-JP')
        };
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).add(item);
      }
      event.target.value = '';
      setTimeout(loadGallery, 300);
    }

    function loadGallery() {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.openCursor(null, 'prev');

      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const data = cursor.value;
          const id = cursor.key;

          const card = document.createElement('div');
          card.className = 'video-card';
          card.innerHTML = `
            <div class="thumb-wrap" onclick="playVideo(${id})">
              <img src="${data.thumb || ''}" alt="thumb">
              <div class="play-badge">▶</div>
            </div>
            <div class="card-footer">
              <span class="video-date">${data.date}</span>
              <div class="card-btns">
                <button class="card-btn" onclick="exportVideo(${id})">📥</button>
                <button class="card-btn" onclick="deleteVideo(${id})">🗑️</button>
              </div>
            </div>
          `;
          gallery.appendChild(card);
          cursor.continue();
        }
      };
    }

    function playVideo(id) {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(id);
      req.onsuccess = (e) => {
        const record = e.target.result;
        if (record) {
          const videoEl = document.getElementById('modal-video');
          const url = URL.createObjectURL(record.blob);
          videoEl.src = url;
          document.getElementById('player-modal').style.display = 'flex';
          videoEl.play();
        }
      };
    }

    function closePlayer() {
      const videoEl = document.getElementById('modal-video');
      videoEl.pause();
      if (videoEl.src) URL.revokeObjectURL(videoEl.src);
      videoEl.src = '';
      document.getElementById('player-modal').style.display = 'none';
    }

    // 写真アプリへの書き出し（ダウンロード）
    async function exportVideo(id) {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(id);
      req.onsuccess = async (e) => {
        const record = e.target.result;
        if (!record) return;

        const file = new File([record.blob], record.name || 'video.mp4', { type: record.type || 'video/mp4' });

        // iOSのWeb Share APIを使って写真アプリへ「ビデオを保存」
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: '動画の保存'
            });
          } catch (err) {
            console.log('共有キャンセル');
          }
        } else {
          // フォールバック（通常ダウンロード）
          const url = URL.createObjectURL(record.blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = record.name || 'video.mp4';
          a.click();
          URL.revokeObjectURL(url);
        }
      };
    }

    function deleteVideo(id) {
      if (confirm('この動画を金庫から削除しますか？')) {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => loadGallery();
      }
    }
  </script>
</body>
</html>
